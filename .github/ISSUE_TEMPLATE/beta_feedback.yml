name: Beta feedback
description: Share your v0.7 beta experience without sending telemetry.
labels: [beta-feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Moodlens. This form is voluntary and public. **Do not include names, email addresses, student IDs, real course content, grades, cookies, `sesskey` values or private Moodle URLs.** Use generic descriptions such as “one assignment was missing”. Security problems go through private reporting in SECURITY.md.
  - type: dropdown
    id: overall
    attributes:
      label: Overall experience
      options:
        - Worked well
        - Worked with minor problems
        - A key feature did not work
        - I could not complete setup
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: UI language tested
      options:
        - English
        - Bahasa Indonesia
        - Both
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: Areas tested
      options:
        - label: Site enablement and removal
        - label: Today and Courses
        - label: Tasks, calendar export and reminders
        - label: Flashcards and practice
        - label: Focus timer and notes
        - label: Moodle appearance options
        - label: Backup and restore
  - type: textarea
    id: useful
    attributes:
      label: What was useful?
      description: Describe the workflow, not real course content.
  - type: textarea
    id: friction
    attributes:
      label: What was confusing or broken?
      description: Include reproducible steps with synthetic names where possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Moodlens version
      placeholder: 0.7.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Chrome version and operating system
      placeholder: Chrome 141 on Windows 11
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This public report contains no personal data, credentials, private URLs or real course content.
          required: true
